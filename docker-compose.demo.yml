services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soc_lite
      POSTGRES_USER: soc_lite
      POSTGRES_PASSWORD: soc_lite_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_lite -d soc_lite"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      INTERNAL_API_KEY: ${TRIAGE_API_KEY:-dev-ai-key}
      ENRICHMENT_ENABLED: "false"
      GEOIP_ENABLED: "false"
    ports:
      - "8001:8001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://soc_lite:soc_lite_dev_password@db:5432/soc_lite
      AUTO_SEED: "true"
      DEMO_MODE: "true"
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      TRIAGE_SERVICE_URL: http://ai-service:8001
      TRIAGE_API_KEY: ${TRIAGE_API_KEY:-dev-ai-key}
      TRIAGE_MODE: auto
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      REPORTS_DIR: /app/storage/reports
    volumes:
      - reports:/app/storage/reports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  reports:
